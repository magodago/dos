<title>D.O.S // v3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; font-family: 'Courier New', monospace; }
  #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  #ui-overlay { position: absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; display:flex; flex-direction:column; align-items:center; padding-top:12vh; }
  #ui-overlay * { pointer-events:auto; }
  .title-main { font-size:clamp(48px,14vw,120px); font-weight:900; letter-spacing:6px; color:transparent; -webkit-text-stroke:3px #00ff41; text-shadow:0 0 10px rgba(0,255,65,0.8),0 0 25px rgba(0,255,65,0.5),0 0 50px rgba(0,255,65,0.3),0 0 100px rgba(0,255,65,0.15); opacity:0; animation:titleGlow 3s ease-out forwards; animation-delay:0.5s; }
  @keyframes titleGlow { 0%{opacity:0;transform:scale(0.8);filter:blur(8px)} 60%{opacity:1;transform:scale(1.05);filter:blur(0)} 100%{opacity:1;transform:scale(1);filter:blur(0)} }
  .title-sub { font-size:clamp(11px,2.5vw,20px); font-weight:700; letter-spacing:8px; color:#fff; text-shadow:0 0 5px #00ff41,0 0 15px #00ff41,0 0 30px rgba(0,255,65,0.7),0 0 60px rgba(0,255,65,0.4); margin-top:0.5vh; opacity:0; animation:subFade 1.5s ease-out forwards; animation-delay:1.8s; }
  @keyframes subFade { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
  .title-tag { font-size:clamp(9px,1.6vw,14px); font-weight:700; color:#ff1744; letter-spacing:4px; margin-top:1.5vh; text-shadow:0 0 5px #ff1744,0 0 15px rgba(255,23,68,0.7),0 0 30px rgba(255,23,68,0.4),0 0 60px rgba(255,23,68,0.2); opacity:0; animation:tagFade 1.2s ease-out forwards; animation-delay:2.8s; }
  @keyframes tagFade { 0%{opacity:0} 100%{opacity:1} }
  .btn-start { margin-top:10vh; padding:14px 40px; background:transparent; border:1px solid rgba(0,255,65,0.4); border-radius:4px; color:#00ff41; font-family:'Courier New',monospace; font-size:clamp(14px,2.2vw,22px); font-weight:700; cursor:pointer; opacity:0; animation:btnFade 1s ease-out forwards; animation-delay:3.8s; transition:all 0.3s ease; text-shadow:0 0 10px rgba(0,255,65,0.3); letter-spacing:3px; }
  @keyframes btnFade { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
  .btn-start:hover { border-color:#00ff41; box-shadow:0 0 20px rgba(0,255,65,0.3),inset 0 0 20px rgba(0,255,65,0.1); color:#fff; }
  .btn-start .cursor { animation:blink 1s step-end infinite; }
  @keyframes blink { 50%{opacity:0} }
  .btn-start.clicked { animation:btnGlitchOut 0.8s ease-out forwards; }
  @keyframes btnGlitchOut { 0%{opacity:1;transform:scale(1)} 20%{opacity:1;transform:translateX(-5px) scale(1.02);filter:hue-rotate(90deg)} 40%{opacity:0.8;transform:translateX(5px)} 60%{opacity:0.6;transform:scale(1.1);filter:brightness(2)} 100%{opacity:0;transform:scale(2);filter:brightness(3)} }
  .version { position:absolute; bottom:15px; right:15px; font-size:10px; color:#333; opacity:0; animation:subFade 1s ease-out forwards; animation-delay:4s; }
  .glitch-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none; opacity:0; }
  .glitch-overlay.active { animation:glitchFlash 0.3s ease-out forwards; }
  @keyframes glitchFlash { 0%{opacity:0} 10%{opacity:0.3;background:rgba(0,255,65,0.15)} 20%{opacity:0} 30%{opacity:0.2;background:rgba(255,255,255,0.1)} 50%{opacity:0} 70%{opacity:0.15;background:rgba(0,255,65,0.1)} 100%{opacity:0} }

const PS = { PLATFORM_SPACING: 75, GRAVITY: 900, BOUNCE: -520, SPEED: 200, WORLD_LIMIT: 20000 };
const LAYERS = [
  { min:0, name:'SHELL', color:'#444' },
  { min:500, name:'KERNEL', color:'#00d4ff' },
  { min:1500, name:'FIREWALL', color:'#ff0044' },
  { min:4000, name:'MAINFRAME', color:'#aa00ff' }
];

class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  preload(){} // All textures generated in create()

  create() {
    this.mode = 'menu';
    this.gameOver = false;
    this.score = 0;
    this.moveDir = 0;
    this.rainDrops = [];
    this.menuParticles = [];
    this.enemies = [];
    this.lastPlatformKey = 0;
    this.highestY = Infinity;
    this.animTime = 0;
    this.speedLines = [];
    this.lastMilestone = 0;

    // Show high score on menu
    const hs = localStorage.getItem('dos_highscore');
    document.getElementById('highScore').textContent = hs ? 'BEST // ' + hs + 'm' : '';

    this.setupTextures();
    this.setupGame();
    this.setupBackground();
    this.setupInput();
    this.startMenuEffects();
    this.playStartupSound();

    // Auto-start if ?restart=1
    if (location.search.includes('restart=1')) {
      this.time.delayedCall(1500, () => this.startGame());
    }
  }

  // ── TEXTURES ──────────────────────────────────────────────────────────
  setupTextures() {
    // Player sprite — fluffy orange plush ball (fallback)
    const pg = this.make.graphics({ add: false });
    // Body — fluffy orange circle with jagged edges
    pg.fillStyle(0xff6622, 1);
    pg.fillCircle(24, 24, 22);
    // Fur texture — multiple small overlapping circles
    for (let ang = 0; ang < 360; ang += 30) {
      const rad = ang * Math.PI / 180;
      const fx = 24 + Math.cos(rad) * 20;
      const fy = 24 + Math.sin(rad) * 20;
      pg.fillStyle(0xff8833, 0.5);
      pg.fillCircle(fx, fy, 6);
    }
    // Darker orange shading
    pg.fillStyle(0xdd5511, 0.3);
    pg.fillCircle(18, 28, 14);
    // Wind-blown fur tufts on left side
    pg.lineStyle(2, 0xff8833, 0.8);
    for (let i = 0; i < 5; i++) {
      const ang = -0.5 + i * 0.3;
      const len = 8 + Math.random() * 6;
      pg.beginPath(); pg.moveTo(6 + i*4, 18 + i*3);
      pg.lineTo(6 + i*4 - len * Math.cos(ang), 18 + i*3 - len * Math.sin(ang));
      pg.strokePath();
    }
    // Neon blue eyes
    pg.fillStyle(0x00ddff, 1);
    pg.fillCircle(17, 20, 4);
    pg.fillCircle(31, 20, 4);
    // Eye glow
    pg.fillStyle(0x66ffff, 0.6);
    pg.fillCircle(17, 20, 6);
    pg.fillCircle(31, 20, 6);
    // Pupils
    pg.fillStyle(0xffffff, 1);
    pg.fillCircle(18, 19, 1.5);
    pg.fillCircle(32, 19, 1.5);
    // Cute mouth
    pg.lineStyle(1, 0xdd4400, 0.8);
    pg.beginPath(); pg.arc(24, 28, 4, 0.2, Math.PI - 0.2); pg.strokePath();
    // Cheek blush
    pg.fillStyle(0xff6644, 0.3);
    pg.fillCircle(12, 27, 4);
    pg.fillCircle(36, 27, 4);
    pg.generateTexture('player', 48, 48); pg.destroy();
    // Load premium ComfyUI sprite via browser Image() (100% reliable)
    this.premiumImg = new Image();
    this.premiumImg.onload = () => {
      try {
        if (this.textures.exists('player_premium')) this.textures.remove('player_premium');
        this.textures.addImage('player_premium', this.premiumImg);
        if (this.player && this.player.active) {
          this.player.setTexture('player_premium');
          this.player.setScale(1.0);
          this.player.setAlpha(1);
          this.player.visible = true;
        }
      } catch(e) { console.warn('Premium load:', e); }
    };
    this.premiumImg.onerror = () => console.warn('Premium player failed');
    this.premiumImg.src = 'data:image/png;base64,' + TEX_PLAYER;

    // Load premium enemies via Image() API
    this.enemyImgs = {};
    ['firewall','virus','bot'].forEach((t,i) => {
      const b64s = [TEX_FIREWALL, TEX_VIRUS, TEX_BOT];
      const key = 'enemy_' + t;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          if (this.textures.exists(key + '_premium')) this.textures.remove(key + '_premium');
          this.textures.addImage(key + '_premium', img);
          // Update existing enemies
          if (this.enemies) {
            this.enemies.forEach(e => {
              if (e.active && e.texture.key === key) e.setTexture(key + '_premium');
            });
          }
        } catch(ex) {}
      };
      img.src = 'data:image/png;base64,' + b64s[i];
      this.enemyImgs[t] = img;
    });
    // Platform — grass fallback
    const plg = this.make.graphics({ add: false });
    plg.fillStyle(0x3a7a2a,1); plg.fillRect(0,0,88,16);
    plg.fillStyle(0x5a9a3a,1); plg.fillRect(0,0,88,6);
    for (let i=0;i<12;i++) {
      plg.fillStyle(0x4a8a2a,0.7);
      plg.fillRect(i*8+Math.random()*3,0,2,4+Math.random()*6);
    }
    plg.fillStyle(0x2a5a1a,1); plg.fillRect(0,10,88,6);
    plg.generateTexture('platform',88,16); plg.destroy();
    // Load premium platform via Image()
    this.platImg = new Image();
    this.platImg.onload = () => {
      try {
        if (this.textures.exists('platform_premium')) this.textures.remove('platform_premium');
        this.textures.addImage('platform_premium', this.platImg);
        if (this.platformGroup) {
          this.platformGroup.children.each(p => { if (p.active) p.setTexture('platform_premium'); });
        }
      } catch(ex) {}
    };
    this.platImg.src = 'data:image/png;base64,' + TEX_PLATFORM;

    // Particle
    const ptg = this.make.graphics({ add: false });
    ptg.fillStyle(0x00ff41,1); ptg.fillCircle(4,4,4);
    ptg.generateTexture('particle',8,8); ptg.destroy();

    // Enemy textures
    this.makeEnemyTextures();
  }

  makeEnemyTextures() {
    // Firewall: rotating shield
    const fg = this.make.graphics({ add: false });
    fg.lineStyle(2, 0xff0044, 0.9); fg.strokeCircle(18,18,16);
    fg.lineStyle(3, 0xff0044, 0.4); fg.strokeCircle(18,18,20);
    for (let a=0; a<8; a++) {
      const ang = a * Math.PI/4;
      fg.lineStyle(2, 0xff0044, 0.7);
      fg.beginPath(); fg.moveTo(18+12*Math.cos(ang), 18+12*Math.sin(ang));
      fg.lineTo(18+18*Math.cos(ang), 18+18*Math.sin(ang)); fg.strokePath();
    }
    fg.fillStyle(0xff0044, 0.3); fg.fillCircle(18,18,10);
    fg.fillStyle(0xffffff, 0.8); fg.fillCircle(18,18,4);
    fg.generateTexture('enemy_firewall', 40, 40); fg.destroy();

    // Virus: pulsing blob with tentacles
    const vg = this.make.graphics({ add: false });
    vg.fillStyle(0xaa00ff, 0.6); vg.fillCircle(18,18,14);
    vg.fillStyle(0xcc44ff, 0.4); vg.fillCircle(18,18,10);
    vg.fillStyle(0xff44ff, 0.3); vg.fillCircle(18,18,6);
    for (let a=0; a<6; a++) {
      const ang = a * Math.PI/3 + 0.3;
      vg.lineStyle(2, 0xaa00ff, 0.5);
      vg.beginPath(); vg.moveTo(18+8*Math.cos(ang), 18+8*Math.sin(ang));
      const len = 10 + Math.random()*6;
      vg.lineTo(18+len*Math.cos(ang), 18+len*Math.sin(ang)); vg.strokePath();
    }
    vg.fillStyle(0x00ff41, 0.7); vg.fillCircle(14,14,2); vg.fillCircle(22,14,2);
    vg.generateTexture('enemy_virus', 36, 36); vg.destroy();

    // Antivirus Bot: angular drone
    const bg = this.make.graphics({ add: false });
    bg.lineStyle(2, 0x00d4ff, 0.9);
    bg.beginPath(); bg.moveTo(10,5); bg.lineTo(30,5); bg.lineTo(35,20);
    bg.lineTo(30,35); bg.lineTo(10,35); bg.lineTo(5,20); bg.closePath(); bg.strokePath();
    bg.lineStyle(1, 0x00d4ff, 0.4);
    bg.beginPath(); bg.moveTo(5,20); bg.lineTo(35,20); bg.strokePath();
    bg.beginPath(); bg.moveTo(20,5); bg.lineTo(20,35); bg.strokePath();
    bg.fillStyle(0x00d4ff, 0.2); bg.fillCircle(20,20,10);
    bg.fillStyle(0x00d4ff, 0.8); bg.fillCircle(20,20,3);
    bg.generateTexture('enemy_bot', 40, 40); bg.destroy();
  }

  // ── PLAYER DRAWING ──────────────────────────────────────────────────
  drawPlayerTo(g, x, y, t) {
    const bob = Math.sin(t * 3) * 0.5;
    const cx = x + 24, cy = y + 24 + bob;
    // Aura
    g.fillStyle(0x00ff41, 0.08 + 0.04 * Math.sin(t * 2));
    g.fillCircle(cx, cy, 28);
    g.fillStyle(0x00ff41, 0.12 + 0.06 * Math.sin(t * 2.5));
    g.fillCircle(cx, cy, 22);
    // Body
    g.fillStyle(0x0a1a0a, 1);
    g.beginPath(); g.moveTo(cx-10, cy-2); g.lineTo(cx+10, cy-2);
    g.lineTo(cx+12, cy+16); g.lineTo(cx+6, cy+18); g.lineTo(cx+6, cy+24);
    g.lineTo(cx-6, cy+24); g.lineTo(cx-6, cy+18); g.lineTo(cx-12, cy+16); g.closePath(); g.fillPath();
    // Coat outline
    g.lineStyle(1, 0x00ff41, 0.4 + 0.2 * Math.sin(t * 2));
    g.beginPath(); g.moveTo(cx-10, cy-2); g.lineTo(cx+10, cy-2);
    g.lineTo(cx+12, cy+16); g.lineTo(cx+6, cy+18); g.lineTo(cx+6, cy+24);
    g.lineTo(cx-6, cy+24); g.lineTo(cx-6, cy+18); g.lineTo(cx-12, cy+16); g.closePath(); g.strokePath();
    // Head
    g.fillStyle(0x1a2a1a, 1); g.fillCircle(cx, cy-8, 8);
    g.lineStyle(1, 0x00ff41, 0.6); g.strokeCircle(cx, cy-8, 8);
    // Eyes
    const eyeGlow = 0.7 + 0.3 * Math.sin(t * 4);
    g.fillStyle(Phaser.Display.Color.GetColor(0, Math.floor(255*eyeGlow), 65), 1);
    g.fillCircle(cx-3, cy-9, 1.8); g.fillCircle(cx+3, cy-9, 1.8);
    g.fillStyle(0xffffff, 0.8); g.fillCircle(cx-3, cy-9, 0.8); g.fillCircle(cx+3, cy-9, 0.8);
    // Cape
    const capeSway = Math.sin(t * 4) * 2;
    g.fillStyle(0x0d1a0d, 0.7);
    g.beginPath(); g.moveTo(cx-10, cy+14);
    g.lineTo(cx-16 + capeSway, cy+22); g.lineTo(cx-8, cy+16); g.closePath(); g.fillPath();
    g.beginPath(); g.moveTo(cx+10, cy+14);

  // ── SETUP ─────────────────────────────────────────────────────────────

  setupBackground() {

  }

  setupInput() {

  }

    for (let i = 0; i < 30; i++) this.menuParticles.push({ x:Phaser.Math.Between(0,GW), y:Phaser.Math.Between(0,GH), vx:Phaser.Math.FloatBetween(-0.2,0.2), vy:Phaser.Math.FloatBetween(-0.3,-0.6), size:Phaser.Math.FloatBetween(0.5,2), alpha:Phaser.Math.FloatBetween(0.1,0.4) });
  }

      const o2=ctx.createOscillator(),g2=ctx.createGain(); o2.type='square'; o2.frequency.setValueAtTime(880,ctx.currentTime+0.3); o2.frequency.setValueAtTime(660,ctx.currentTime+0.5); o2.frequency.setValueAtTime(1320,ctx.currentTime+0.7); g2.gain.setValueAtTime(0.05,ctx.currentTime+0.3); g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.0); o2.connect(g2);g2.connect(ctx.destination);o2.start(ctx.currentTime+0.3);o2.stop(ctx.currentTime+1.0);
    } catch(e) {}

  // ── GAME START ─────────────────────────────────────────────────────────
  startGame() {
    // Clean up URL if it had restart param
    if (location.search.includes('restart=1')) {
      window.history.replaceState({}, '', location.pathname);
    }
    this.mode = 'game';
    this.gameOver = false;
    this.endingShown = false;
    this.score = 0;
    this.moveDir = 0;
    this.highestY = Infinity;
    this.enemies = [];
    this.trailPositions = [];
    this.lastMilestone = 0;
    const W = GW, H = GH;

    this.player.visible = true;
    this.player.setPosition(W/2, 80);
    this.player.body.setAllowGravity(true);
    this.player.body.setVelocity(0, 0);
    this.player.clearTint();
    this.player.setDepth(10);
    this.player.squashTween = 1;

    this.platformGroup.visible = true;
    this.platformGroup.clear(true, true);
    this.landParticles.visible = true;

    this.cameras.main.setScroll(0, 0);
    this.cameras.main.startFollow(this.player, false, 0.08, 0.08);

    // First platform
    const platKey = (this.textures && this.textures.exists('platform_premium')) ? 'platform_premium' : 'platform';

    let y = 140;

    document.getElementById('game-hud').style.display = 'block';

    document.getElementById('hudLayer').textContent = 'SHELL';

  }

  // ── COLLISION ──────────────────────────────────────────────────────────
  onLand(player, platform) {
    if (this.gameOver || this.mode !== 'game') return;
    player.body.setVelocityY(PS.BOUNCE);

    // Squash & stretch
    this.player.squashTween = -0.3;
    this.player.landedTime = this.animTime;

    // Particles burst (upward)
    this.landParticles.emitParticleAt(player.x, player.y + 12);

    // Camera shake
    this.cameras.main.shake(80, 0.004);

    // Score
    this.score = Math.floor(-Math.min(this.highestY, player.y) / 10);
    document.getElementById('hudHeight').textContent = 'HEIGHT: ' + this.score + 'm';

    // Layer
    for (const layer of LAYERS) {
      if (this.score >= layer.min) {
        document.getElementById('hudLayer').textContent = layer.name;
        document.getElementById('hudLayer').style.color = layer.color;
      }
    }

    // Milestone popup
    const milestone = Math.floor(this.score / 100) * 100;
    if (milestone > 0 && milestone !== this.lastMilestone) {
      this.lastMilestone = milestone;
      this.showMilestone('+' + milestone + 'm');
    }
  }

  showMilestone(text) {
    const el = document.getElementById('hudMilestone');
    el.textContent = text;
    el.style.color = '#00ff41';
    el.style.opacity = 1;
    el.style.transform = 'translate(-50%,-50%) scale(0.5)';
    el.style.transition = 'none';
    requestAnimationFrame(() => {
      el.style.transition = 'all 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2)';
      el.style.opacity = '0';

  // ── ENEMIES ────────────────────────────────────────────────────────────
  spawnEnemy(y, type) {
    const W = GW;
    const baseKey = 'enemy_' + type;
    const texKey = (this.textures && this.textures.exists(baseKey + '_premium')) ? baseKey + '_premium' : baseKey;
    const x = Phaser.Math.Between(60, W-60);
    const enemy = this.physics.add.sprite(x, y, texKey);
    enemy.setDepth(8);
    enemy.body.setAllowGravity(false);
    enemy.enemyType = type;
    enemy.startX = x;
    enemy.startY = y;
    enemy.phase = Math.random() * Math.PI * 2;
    enemy.phaseSpeed = 0.02 + Math.random() * 0.03; // unique speed per enemy
    enemy.speed = type === 'firewall' ? 60 : type === 'bot' ? 80 : 40;
    enemy.range = type === 'firewall' ? 60 : type === 'bot' ? 100 : 40;

    this.physics.add.overlap(this.player, enemy, this.onEnemyHit, null, this);
    this.enemies.push(enemy);
  }

  onEnemyHit(player, enemy) {
    if (this.gameOver) return;
    this.gameOver = true;
    // Just flag death - update() loop will handle the rest
  }

    const prev = parseInt(localStorage.getItem('dos_highscore') || '0');

    const W = GW, H = GH;

    this.player.setVisible(false);

    // Overlay (screen-fixed coordinates)
    const gfx = this.add.graphics().setDepth(200).setScrollFactor(0);

    this.add.text(W/2, H/2 - 80, 'SYSTEM FAILURE', {

    }).setOrigin(0.5).setDepth(201).setScrollFactor(0);

    this.add.text(W/2, H/2 - 35, 'HEIGHT: '+this.score+'m', {
      fontSize:'18px', fontFamily:'Courier New',color:'#00ff41'
    }).setOrigin(0.5).setDepth(201).setScrollFactor(0);

    this.add.text(W/2, H/2 + 35, '> RESTART <', {
      fontSize:'16px', fontFamily:'Courier New',color:'#00ff41'
    }).setOrigin(0.5).setDepth(201).setScrollFactor(0).setInteractive().on('pointerdown',
      ()=>location.href=location.pathname+'?restart=1');

    this.add.text(W/2, H/2 + 65, '[ HOME ]', {
      fontSize:'13px', fontFamily:'Courier New',color:'#555'
    }).setOrigin(0.5).setDepth(201).setScrollFactor(0).setInteractive().on('pointerdown',
      ()=>{ document.body.classList.remove('game-active'); location.reload(); });
  }

  // ── UPDATE ─────────────────────────────────────────────────────────────
  update(time, delta) {
    const W = GW, H = GH;
    const dt = delta / 16;
    this.animTime += dt * 0.06;

    // ── MENU BACKGROUND ──
    this.gridOffset += 0.3 * dt;
    this.gridGfx.clear();
    const sp = 40;
    this.gridGfx.lineStyle(0.5, 0x003300, 0.2);
    for (let x = 0; x < W; x += sp) { this.gridGfx.beginPath(); this.gridGfx.moveTo(x,0); this.gridGfx.lineTo(x,H); this.gridGfx.strokePath(); }
    for (let y = -sp + (this.gridOffset%sp); y < H; y += sp) { this.gridGfx.beginPath(); this.gridGfx.moveTo(0,y); this.gridGfx.lineTo(W,y); this.gridGfx.strokePath(); }
    this.gridGfx.fillStyle(0x00ff41,0.1);
    for (let x = 0; x < W; x += sp) for (let y = -sp + (this.gridOffset%sp); y < H; y += sp) this.gridGfx.fillRect(x-1,y-1,2,2);

    if (this.mode === 'menu') {
      this.rainGfx.visible = true; this.rainGfx.clear();
      for (const d of this.rainDrops) {
        d.y += d.speed * dt;
        if (d.y > H+20) { d.y = -d.length*14; d.x = Phaser.Math.Between(0,W); }
        const a = Phaser.Math.Clamp(1-(d.y/H),0.05,0.3);
        this.rainGfx.fillStyle(0x00ff41,a*0.7); this.rainGfx.fillRect(d.x-2,d.y-5,4,5);
        this.rainGfx.fillStyle(0x00ff41,a*0.05); this.rainGfx.fillRect(d.x-0.5,d.y,1,d.length*12);
      }
      for (const p of this.menuParticles) {
        p.x += p.vx*dt; p.y += p.vy*dt;
        if (p.y < -10) { p.y = H+10; p.x = Phaser.Math.Between(0,W); }
        if (p.x < -10 || p.x > W+10) p.vx *= -1;
        this.rainGfx.fillStyle(0x00ff41,p.alpha); this.rainGfx.fillCircle(p.x,p.y,p.size);
      }
    } else {
      this.rainGfx.visible = false;
    }

    if (this.mode !== 'game') {
      return;
    }

    // ── GAME OVER CHECK ──
    if (this.gameOver) {
      if (!this.endingShown) this.showGameOver();
      return;
    }

    // ── GAME LOGIC ──
    const body = this.player.body;

    // Input
    let mx = 0;
    if (this.cursors.left.isDown) mx = -1;
    else if (this.cursors.right.isDown) mx = 1;
    else if (this.moveDir !== 0) mx = this.moveDir;
    body.setVelocityX(mx * PS.SPEED);
    this.player.setFlipX(mx < 0); // flip sprite when moving left

    // Wrap
    if (this.player.x < -10) this.player.x = W + 10;
    else if (this.player.x > W + 10) this.player.x = -10;

    // Generate platforms
    if (this.player.y < this.lastPlatformKey + 1500) {
      let y = this.lastPlatformKey;
      const platKey = (this.textures && this.textures.exists('platform_premium')) ? 'platform_premium' : 'platform';
      for (let i = 0; i < 10; i++) {
        y -= PS.PLATFORM_SPACING;
        this.platformGroup.create(Phaser.Math.Between(50,W-50), y, platKey).refreshBody();
      }
      this.lastPlatformKey = y;
    }

    // Remove far platforms
    this.platformGroup.children.each((p) => { if (p.y > this.player.y + H + 200) p.destroy(); });

    // ── PLATFORM LIGHT BEAM (breathing red haze) ──
    this.platformGlowGfx.clear();
    const beam = 0.06 + 0.04 * Math.sin(this.animTime * 2);
    const beamWide = 0.03 + 0.02 * Math.sin(this.animTime * 2.5);
    this.platformGroup.children.each(p => {
      if (!p.active) return;
      // Wide faint glow
      this.platformGlowGfx.fillStyle(0x44ff44, beamWide * 0.4);
      this.platformGlowGfx.fillRect(p.x - 50, p.y - 30, 100, 40);
      // Core beam
      this.platformGlowGfx.fillStyle(0x44ff44, beam);
      this.platformGlowGfx.fillRect(p.x - 30, p.y - 20, 60, 30);
      // Intense top
      this.platformGlowGfx.fillStyle(0x88ff88, beam * 0.6);
      this.platformGlowGfx.fillRect(p.x - 10, p.y - 25, 20, 10);
    });

    // Game over
    if (this.player.y > H + 150) {
      this.showGameOver(this.player.x, this.player.y);
    }

    // Track height
    if (this.player.y < this.highestY) {
      this.highestY = this.player.y;
      this.score = Math.floor(-this.highestY / 10);
      document.getElementById('hudHeight').textContent = 'HEIGHT: ' + this.score + 'm';

      // Spawn enemies with progressive difficulty
      const spawnChance = Math.min(0.35, 0.02 + this.score * 0.00008);
      const spawnInterval = Math.max(10, 50 - Math.floor(this.score / 20));
      if (this.score > 150 && this.score % spawnInterval < 3 && Math.random() < spawnChance) {
        const types = ['firewall', 'virus', 'bot'];
        // More enemy types at higher scores
        const available = this.score > 500 ? types : this.score > 300 ? types.slice(0,2) : types.slice(0,1);
        // Sometimes spawn 2 enemies at high scores
        const count = (this.score > 800 && Math.random() < 0.3) ? 2 : 1;
        for (let i = 0; i < count; i++) {
          this.spawnEnemy(this.player.y - GH * (0.5 + Math.random() * 0.5), Phaser.Math.RND.pick(available));
        }
      }

      for (const layer of LAYERS) {
        if (this.score >= layer.min) {
          document.getElementById('hudLayer').textContent = layer.name;
          document.getElementById('hudLayer').style.color = layer.color;
        }
      }
    }

    // ── SQUASH & STRETCH ──
    const dt2 = this.animTime - this.player.landedTime;
    if (this.player.squashTween < 0) {
      this.player.squashTween += 0.04 * dt;
      if (this.player.squashTween >= 0) this.player.squashTween = 0.15;
    } else if (this.player.squashTween > 0) {
      this.player.squashTween -= 0.015 * dt;
      if (this.player.squashTween < 0) this.player.squashTween = 0;
    }
    const sx = 1 + this.player.squashTween * 1.8;
    const sy = 1 - this.player.squashTween * 1.2;
    this.player.setScale(sx, sy);

    // No rotation — overlay always faces forward

    // ── PLAYER VISUAL ── (robot ball glow pulse)
    this.playerOverlay.clear();
    this.playerOverlay.fillStyle(0x00ff41, 0.06 + 0.03 * Math.sin(this.animTime * 2));
    this.playerOverlay.fillCircle(this.player.x, this.player.y, 30 + Math.sin(this.animTime * 3) * 3);

    // ── TRAIL ──
    this.trailGfx.clear();
    if (Math.abs(body.velocity.y) > 200) {
      this.trailPositions.unshift({ x: this.player.x, y: this.player.y, a: 1 });
      if (this.trailPositions.length > 8) this.trailPositions.pop();
      for (let i = 0; i < this.trailPositions.length; i++) {
        const t = this.trailPositions[i];
        t.a -= 0.04 * dt;
        if (t.a > 0) {
          this.trailGfx.fillStyle(0x00ff41, t.a * 0.15);
          this.trailGfx.fillCircle(t.x, t.y, 10 - i);
        }
      }
    } else {
      this.trailPositions = [];
    }

    // ── SPEED LINES ──
    this.speedLineGfx.clear();
    if (body.velocity.y > 300) {
      const intensity = Phaser.Math.Clamp((body.velocity.y - 300) / 500, 0, 1);
      this.speedLineGfx.lineStyle(1, 0x00ff41, 0.1 * intensity);
      for (let i = 0; i < 5; i++) {
        const lx = Phaser.Math.Between(0, W);
        const ly = Phaser.Math.Between(0, H) + this.cameras.main.scrollY;
        const len = Phaser.Math.Between(15, 40);
        this.speedLineGfx.beginPath();
        this.speedLineGfx.moveTo(lx, ly);
        this.speedLineGfx.lineTo(lx, ly + len);
        this.speedLineGfx.strokePath();
      }
    }

    // ── ENEMIES ──
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!e.active) { this.enemies.splice(i, 1); continue; }
      if (e.y > this.player.y + H + 100) { e.destroy(); this.enemies.splice(i, 1); continue; }

      e.phase += e.phaseSpeed * dt;
      if (e.enemyType === 'firewall') {
        e.x = e.startX + Math.sin(e.phase) * e.range;
        e.rotation += 0.05 * dt;
      } else if (e.enemyType === 'bot') {
        e.x = e.startX + Math.sin(e.phase * 0.7) * e.range;
        e.y = e.startY + Math.sin(e.phase * 1.2) * 20;
        e.rotation = Math.sin(e.phase) * 0.3;
      } else {
        e.x = e.startX + Math.sin(e.phase * 0.5) * 30;
        e.y = e.startY + Math.sin(e.phase * 0.8) * 15;
        e.setScale(0.8 + 0.1 * Math.sin(e.phase * 2));
      }
      e.body.updateFromGameObject();
    }

    // ── SCROLLING BACKGROUND ──
    const camY = this.cameras.main.scrollY;
    this.bgGfx.clear();
    // Scrolling nebula (TileSprite with parallax)
    if (this.bgTile && this.bgTile.active) {
      this.bgTile.tilePositionY = camY * 0.3;
    }
    // Subtle grid overlay
    this.bgGfx.lineStyle(0.5, 0x003300, 0.08);
    for (let x = 0; x < W; x += sp) { this.bgGfx.beginPath(); this.bgGfx.moveTo(x,camY); this.bgGfx.lineTo(x,camY+H); this.bgGfx.strokePath(); }
    for (let y = Math.floor(camY/sp)*sp; y < camY+H; y += sp) { this.bgGfx.beginPath(); this.bgGfx.moveTo(0,y); this.bgGfx.lineTo(W,y); this.bgGfx.strokePath(); }
  }
}
